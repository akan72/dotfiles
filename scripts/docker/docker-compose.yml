services:
  notebook:
    build:
      context: .
      dockerfile: Dockerfile.notebook
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./:/scripts
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--no-browser"]
