name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_MALWARE_CHECK: "1"

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check shell syntax
        run: |
          for file in assimilate.sh bashrc bash_profile shared.sh claude/statusline.sh scripts/ci/*.sh scripts/security/*.sh tests/*.sh; do
            bash -n "$file"
          done
          zsh -f -n zshrc
      - name: Test VPS container harness
        run: |
          scripts/ci/test-vps-container.sh
          bash tests/clone-pinned.sh
          bash tests/security-scans.sh
          bash tests/npm-age.sh
          bash tests/artifact-integrity.sh
          python3 -I -S -B tests/source-snapshot.py
          sh tests/gh-auth-refresh.sh
      - name: Check Git configuration
        run: git config --file gitconfig --list >/dev/null
      - name: Check strict JSON
        run: |
          find nvim -maxdepth 1 -type f -name '*.json' -exec jq empty {} +
          jq empty vscode/code_settings.json zed/keymap.json

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pre-commit
        run: |
          python3.12 -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip --isolated install --index-url https://pypi.org/simple \
            --require-hashes --only-binary=:all: --no-deps \
            -r scripts/security/requirements-pre-commit-linux-py312.txt
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip check
      - name: Run repository hooks
        run: '"$RUNNER_TEMP/pre-commit/bin/python" -m pre_commit run --all-files --show-diff-on-failure'

  actions-security:
    name: Actions security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Audit workflows with zizmor
        run: |
          python3.12 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/python" -m pip --isolated install --index-url https://pypi.org/simple \
            --require-hashes --only-binary=:all: --no-deps \
            -r scripts/security/requirements-zizmor-linux.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --strict-collection --no-config .

  secret-history:
    name: Secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history
        run: '"${RUNNER_TEMP}/bin/gitleaks" git --redact=100 --no-banner --no-color'

  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Install dotfiles twice on hosted runner
        env:
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          # The hosted VM and its home directory are discarded after this job.
          # Keep the runner's package-manager state while honoring assimilate's
          # documented requirement that the repository live at $HOME/dotfiles.
          test ! -e "$HOME/dotfiles"
          ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"

          first_started=$SECONDS
          DOTFILES_DISPOSABLE_CI=1 scripts/ci/anonymous-github.sh ./assimilate.sh
          DOTFILES="$HOME/dotfiles" scripts/ci/verify-assimilate.sh
          first_seconds=$((SECONDS - first_started))
          backup_count="$(find "$HOME/backups" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"

          second_started=$SECONDS
          DOTFILES_DISPOSABLE_CI=1 ASSIMILATE_SKIP_PLUGIN_SYNC=1 scripts/ci/anonymous-github.sh ./assimilate.sh
          DOTFILES="$HOME/dotfiles" scripts/ci/verify-assimilate.sh
          second_seconds=$((SECONDS - second_started))

          test "$(find "$HOME/backups" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "$backup_count"

          {
            echo "### Install timing (${{ matrix.os }})"
            echo
            echo "| Pass | Seconds |"
            echo "| --- | ---: |"
            echo "| Clean install | $first_seconds |"
            echo "| Idempotency | $second_seconds |"
          } >> "$GITHUB_STEP_SUMMARY"

  vps-install:
    name: VPS install (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - ubuntu
          - amazon-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dotfiles twice in a minimal VPS image
        env:
          VPS_TARGET: ${{ matrix.target }}
        run: scripts/ci/run-vps-container.sh run "$VPS_TARGET"
