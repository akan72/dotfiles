name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_MALWARE_CHECK: "1"

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check shell syntax
        run: |
          bash -n assimilate.sh bashrc bash_profile claude/statusline.sh scripts/ci/verify-assimilate.sh
          zsh -n zshrc
      - name: Check Git configuration
        run: git config --file gitconfig --list >/dev/null
      - name: Check strict JSON
        run: |
          jq empty nvim/coc-settings.json
          jq empty vscode/code_settings.json
          jq empty zed/keymap.json

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pre-commit
        run: python3 -m pip install --user pre-commit==4.6.2
      - name: Run repository hooks
        run: python3 -m pre_commit run --all-files --show-diff-on-failure

  actions-security:
    name: Actions security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Audit workflows with zizmor
        run: pipx run zizmor==1.29.0 .

  secret-history:
    name: Secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history
        run: '"${RUNNER_TEMP}/bin/gitleaks" git --redact --verbose'

  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Install dotfiles twice in an isolated home
        env:
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          test_home="${RUNNER_TEMP}/dotfiles-home"
          mkdir -p "$test_home"
          ln -s "$GITHUB_WORKSPACE" "$test_home/dotfiles"

          # GitHub's macOS image has trusted taps for its preinstalled tools.
          # Preserve only that public tap metadata when isolating HOME.
          if [ -f "$HOME/.homebrew/trust.json" ]; then
            mkdir -p "$test_home/.homebrew"
            cp "$HOME/.homebrew/trust.json" "$test_home/.homebrew/trust.json"
          fi

          HOME="$test_home" ./assimilate.sh
          HOME="$test_home" DOTFILES="$GITHUB_WORKSPACE" scripts/ci/verify-assimilate.sh

          HOME="$test_home" ./assimilate.sh
          HOME="$test_home" DOTFILES="$GITHUB_WORKSPACE" scripts/ci/verify-assimilate.sh

          test -z "$(find "$test_home/backups" -mindepth 1 -maxdepth 1 -print -quit)"
